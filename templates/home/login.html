{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <link rel="stylesheet" href="{% static 'Admin/admin_css/admin_dashboard.css' %}">
    <script src="{% static 'Admin/admin_js/admin_dashboard.js' %}"></script>

    <title>Admin Login</title>
</head>
<body>
    <div class="row mt-5">
        <div class="col-md-3"></div>
        <div class="col-md-6">

            <form method="post" action="" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="row">
                <div class="col-md-4"></div>
                <div class="col-md-4">LOGIN</div>
                <div class="col-md-4"></div>
            </div>
            <b></b><br>
            <div class="row">
                <div class="col-md-3"></div>
                <div class="col-md-3">Email</div>
                <div class="col-md-3"><input type="email" name="email" required></div>
                <div class="col-md-3"></div>
            </div>
            <div class="row">
                <div class="col-md-3"></div>
                <div class="col-md-3">Password</div>
                <div class="col-md-3"><input type="text" type="password" name="password" required></div>
                <div class="col-md-3"></div>
            </div>
            <div class="row">
                <div class="col-md-4"></div>
                <div class="col-md-4"><button type="submit">Login</button>
                <div class="col-md-4"></div>
            </div>

            </form>

        </div>
        
        <div class="col-md-3"></div>
        
    </div>
</body>
</html>
