{% extends "admin/admin_dashboard.html" %}
{% load static %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<style>
    table {
        background-color: green;
        
    }
</style>

<button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#myModal">
        <i class="mdi mdi-check"></i>&nbsp; Add Quotation</button>
    <table>
        <tr>
            <th>Customer Name</th>
            <th>Contact</th>
            <th>View PDF</th>
            <th>Action</th>
        </tr>
        <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
        </tr>
    </table>


<!-- Modal -->


 <div class="modal fade" id="myModal">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title text-info">Add Quotation</h5>
          <button type="button" class="close text-light" data-dismiss="modal" aria-label=""
            style="font-size: 20px;border:none;">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="table-responsive mt-3 mb-3 container">

        <form method="post" action="" id="" autocomplete="off" enctype="multipart/form-data">
            {% csrf_token %}

          <div class="row">
                
                <div class="row">
                    <div class="col-md-4">Item
                        <br>
                        <input type="text" id="item">
                    </div>
                    <div class="col-md-4">Qty
                        <br>
                        <input type="text" id="qty">
                    </div>
                    <div class="col-md-4">Price
                        <br>
                        <input type="text" id="price">
                    </div>
                </div>
    
                <div class="row">
                    <div class="col-md-4"></div>
                    <div class="col-md-4"><button type="submit" id="admin_ajax_add_quotation_save">Submit</button></div>
                    <div class="col-md-4"></div>
                </div>
                <br>
            </div>

        </form>
<br>
        <form method="post" action="" id="" autocomplete="off" enctype="multipart/form-data">
            {% csrf_token %}

          <div class="row">
                
                <div class="row">
                    <div class="col-md-6">
                        <input type="text" id="advance">
                    </div>
                    <div class="col-md-6">
                        <button type="submit" id="admin_ajax_add_quotation_advance_save">Submit</button>
                        
                    </div>
                  
            </div>

        </form>
<br>
            <table class="table   table-bordered ">
            <thead >
              <tr>
                <th scope="col">Item</th>
                <th scope="col">Qty</th>
                <th scope="col">Price</th>
                <th scope="col">Action</th>
              </tr>
            </thead>

            <tbody>

              

              <tr>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
            </tbody>
          </table>

        </div>

      </div>
    </div>
  </div>


<img src="Admin/gallery/logo/logo.png" id="img">
hello
</div>
<div>
<a href="{% url 'admin_view_pdf' %}">Dashboard</a>
</div>



<script>

$(document).on("click", "#admin_ajax_add_quotation_save", function(){
$(document).on("click", "#admin_ajax_add_quotation_advance_save", function(){

$.ajax({

    type : 'POST',
    url:"{% url 'admin_ajax_add_quotation' %}",
    data:{
        item : $('#item').val(),
        qty : $('#qty').val(),
        price : $('#price').val(),

        csrfmiddlewaretoken: '{{ csrf_token }}',
    },
   
    
});  
} 
);


</script>


{% endblock %}
