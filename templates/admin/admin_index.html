{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Events</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet"
          href="{% static 'Admin/admin_css/admin_dashboard.css' %}">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="{% static 'Admin/admin_js/admin_dashboard.js' %}"></script>

    <style>
       html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

.main-content {
    flex: 1;
    width: 100%;
    padding: 30px;
    box-sizing: border-box;
}

/* Mobile */
@media (max-width: 576px) {
    .main-content {
        padding: 15px;
    }
}
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light"
     style="background-color: #8fca09;">

    <div class="container-fluid">

        <!-- Logo / Brand -->
        <a class="navbar-brand d-flex align-items-center"
           href="{% url 'admin_dashboard' %}">

            {% if Adm.profile_pic %}
                <img src="{{ Adm.profile_pic.url }}"
                     alt="Logo"
                     width="40"
                     height="40"
                     class="rounded-circle me-2">
            {% endif %}

            <span>{{ Adm.name }}</span>
        </a>


        <!-- Mobile Toggle -->
        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>


        <!-- Navigation -->
        <div class="collapse navbar-collapse justify-content-end"
             id="navbarNav">

            <ul class="navbar-nav">

                <!-- Home -->
                <li class="nav-item">
                    <a class="nav-link active"
                       href="{% url 'admin_dashboard' %}">
                        Home
                    </a>
                </li>


                <!-- Document -->
                <li class="nav-item">
                    <a class="nav-link"
                       href="{% url 'admin_view_list' %}">
                        Document
                    </a>
                </li>


                <!-- Category -->
                <li class="nav-item dropdown">

                    <a class="nav-link dropdown-toggle"
                       href="#"
                       id="categoryDropdown"
                       role="button"
                       data-bs-toggle="dropdown"
                       aria-expanded="false">

                        Category

                    </a>

                    <ul class="dropdown-menu"
                        aria-labelledby="categoryDropdown">

                        <li>
                            <a class="dropdown-item"
                               href="{% url 'admin_add_category' %}">
                                Add Category
                            </a>
                        </li>

                    </ul>

                </li>


                <!-- Logout -->
                <li class="nav-item">
                    <a class="nav-link"
                       href="{% url 'Admin_logout' %}">
                        Logout
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- Main Content -->
<main class="main-content">

    {% block content %}

    {% endblock %}

</main>


<!-- Footer -->
<footer class="text-white text-center py-4"
        style="background-color: #8fca09;">

    <div class="container">

        <p class="mb-1">
            &copy; 2026 Your Company. All rights reserved.
        </p>

        <div>

            <a href="#"
               class="text-white text-decoration-none me-3">
                Home
            </a>

            <a href="#"
               class="text-white text-decoration-none me-3">
                About
            </a>

            <a href="#"
               class="text-white text-decoration-none me-3">
                Services
            </a>

            <a href="#"
               class="text-white text-decoration-none">
                Contact
            </a>

        </div>

    </div>

</footer>

</body>
</html>
