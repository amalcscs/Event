{% extends "admin/admin_index.html" %}
{% load static %}

{% block content %}
<br>
<center>EDIT</center>
<br>
    <div class="row">
        <div class="col-md-2"></div>
        <div class="col-md-8">
            <form method="post" action="" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="row">
                <div class="col-md-6">Category Name</div>
                <div class="col-md-6"><input type="text" name="edit_cat_name" value="{{get_cate.category}}"></div>
            </div>
           
            <div class="row">
                <div class="col-md-4"></div>
                <div class="col-md-4"><button type="submit" name="">Submit</div>
                <div class="col-md-4"></div>
            </div>
        </div>

         </form>

        <div class="col-md-2"></div>

       

    </div>

<br>

<div>
    <center>CATEGORY LIST</center><br>
    <table>
        <tr>
            <th>No</th>
            <th>Category</th>
            <th>Edit</th>
            <th>Delete</th>
        </tr>
        <tr>
            {% for i in cate %}
            <td>{{ forloop.counter }}</td>
            <td>{{i.category}}</td>
            <td>
                <a href="{% url 'admin_edit_category' i.id %}" type="button" class="btn btn-success"><i class="mdi mdi-check"></i>&nbsp; Edit</a>
            </td>
            <td>
                <a href="{% url 'admin_delete_category' i.id %}" type="button" class="btn btn-danger"><i class="mdi mdi-check"></i>&nbsp; Delete</a>
            </td>
            {% endfor %}
        </tr>
    </table>
</div>
    
    
{% endblock %}
