{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <link rel="stylesheet" href="{% static 'Admin/admin_css/admin_dashboard.css' %}">
    <script src="{% static 'Admin/admin_js/admin_dashboard.js' %}"></script>

    <title>Admin Register</title>
</head>
<body>
    <center style="margin-top:50px;"><b>REGISTER</b></center><br><br>
    <div class="row">
        <div class="col-md-4"></div>
        <div class="col-md-4">
            <form method="post" action="" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="row">
                <div class="col-md-6">Name</div>
                <div class="col-md-6"><input type="text" name="name"></div>
            </div>
            <div class="row">
                <div class="col-md-6">Address</div>
                <div class="col-md-6"><input type="text" name="address"></div>
            </div>
            <div class="row">
                <div class="col-md-6">Email</div>
                <div class="col-md-6"><input type="text" name="email"></div>
            </div>
            <div class="row">
                <div class="col-md-6">Profile Picture</div>
                <div class="col-md-6"><input type="file" name="profile_pic"></div>
            </div>
            <br>
            <div class="row">
                <div class="col-md-4"></div>
                <div class="col-md-4"><button type="submit" name="">Submit</div>
                <div class="col-md-4"></div>
            </div>
        </div>

         </form>

        <div class="col-md-4"></div>

       

    </div>
</body>
</html>
